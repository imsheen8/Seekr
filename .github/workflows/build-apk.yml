name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python (for patch script)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests (shims + end-to-end search, no Android needed)
        continue-on-error: true
        run: |
          pip install flask flask-babel jinja2 pygments python-dateutil pyyaml babel markdown-it-py isodate whitenoise typing-extensions certifi requests lxml typer-slim valkey
          PYTHONPATH=.:android-python python tests/test_shims.py
          PYTHONPATH=.:android-python python tests/test_e2e_search.py

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Patch Android project (Chaquopy + Seekr)
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: python3 scripts/patch-android.py

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seekr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
